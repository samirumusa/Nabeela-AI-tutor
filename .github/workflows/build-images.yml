name: Build Nabeela inference images
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images to GHCR (set package visibility to private)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: [backend, qwen, kokoro]
    steps:
      - uses: actions/checkout@v4
      - name: Release image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/nabeela-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - name: Recover runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}.Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.publish }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          provenance: mode=min
